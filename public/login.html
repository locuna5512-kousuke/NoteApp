<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ログイン | AIといっしょ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login">
    <!-- 左: アプリ名と、本の上で眠るねこ -->
    <section class="login-art" aria-label="AIといっしょ">
      <svg class="i book" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 6.5 4.5 3 5v13c3.5-.5 7 0 9 1.5 2-1.5 5.5-2 9-1.5V5c-3.5-.5-7 0-9 1.5z M12 6.5v13"/><path d="M18.5 2.2v1.6 M17.7 3h1.6" stroke-width=".9"/></svg>
      <h1>AIといっしょ</h1>
      <p>PC で書いて、スマホで復習。<br>科目 › 単元 › ノートで、授業をすっきり整理。</p>
      <svg class="cat" viewBox="0 0 200 130" aria-hidden="true">
        <g fill="none" stroke="#5b4a72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8v10 M13 13h10" stroke="#b9a8d6" stroke-width="1.6"/>
          <path d="M176 30v8 M172 34h8" stroke="#b9a8d6" stroke-width="1.6"/>
          <rect x="22" y="104" width="134" height="22" rx="4" fill="#a8b89a"/>
          <path d="M30 115h112" stroke="#eef2e8" stroke-width="3"/>
          <rect x="34" y="84" width="120" height="21" rx="4" fill="#bfb0dc"/>
          <path d="M42 94h100" stroke="#f3eefb" stroke-width="3"/>
          <path d="M50 84c-4-22 8-38 30-42l4-14 12 12c10-1 22 0 30 4l12-12 2 16c10 8 12 24 8 36z" fill="#fff"/>
          <path d="M140 76c12 0 18-8 16-16" />
          <path d="M72 62c3 3 7 3 10 0 M100 62c3 3 7 3 10 0"/>
          <path d="M88 70l3 2 3-2"/>
        </g>
        <ellipse cx="68" cy="72" rx="6" ry="3.5" fill="#f2c4cc" opacity=".8"/>
        <ellipse cx="116" cy="72" rx="6" ry="3.5" fill="#f2c4cc" opacity=".8"/>
      </svg>
    </section>

    <!-- 右: ログインのフォーム -->
    <section class="login-form-wrap">
      <form class="login-form" id="loginForm" novalidate>
        <h2 id="formTitle">ログイン</h2>
        <p class="lead">はじめての方は、ログインするとサンプル科目が用意されます</p>

        <button class="btn google" type="button" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Google アカウントでログイン</button>

        <p class="or">またはメールで</p>

        <label class="field"><span>メールアドレス</span>
          <input id="email" type="email" required autocomplete="email" inputmode="email" placeholder="you@example.ac.jp">
        </label>
        <label class="field"><span>パスワード</span>
          <input id="password" type="password" required autocomplete="current-password" placeholder="8文字以上">
        </label>

        <p class="login-msg" id="msg" role="status" hidden></p>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn">ログイン
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10 M9 4l4 4-4 4"/></svg></button>

        <div class="login-links">
          <button type="button" id="modeBtn">はじめての方は新規登録</button>
          <a href="index.html">ゲストとして使ってみる（この端末だけに保存）</a>
        </div>
      </form>
    </section>
  </div>

  <script type="module">
    import * as cloud from './cloud.js';

    const $ = (s) => document.querySelector(s);
    const NEXT = 'index.html'; // ログインできたら開く画面
    let mode = 'signin';       // 'signin' / 'signup'

    function say(text, kind) {
      const m = $('#msg');
      m.textContent = text;
      m.className = `login-msg ${kind}`;
      m.hidden = !text;
    }

    // Supabase のよくあるエラーを日本語にする
    function message(error) {
      const t = error?.message || '';
      if (/Invalid login credentials/i.test(t)) return 'メールアドレスかパスワードが違います。';
      if (/Email not confirmed/i.test(t)) return 'メールの確認がまだです。届いたメールのリンクを開いてください。';
      if (/already registered|already been registered/i.test(t)) return 'このメールアドレスは登録済みです。ログインしてください。';
      if (/Password should be/i.test(t)) return 'パスワードが短すぎます。8文字以上にしてください。';
      if (/provider is not enabled|Unsupported provider/i.test(t)) return 'Google ログインはまだ使えません。メールでログインしてください。';
      if (/rate limit/i.test(t)) return '短い時間に何度も試したため、少し待ってからやり直してください。';
      return `うまくいきませんでした（${t || '通信エラー'}）。`;
    }

    // ログイン ⇔ 新規登録 の切り替え
    function setMode(m) {
      mode = m;
      const up = m === 'signup';
      $('#formTitle').textContent = up ? '新規登録' : 'ログイン';
      $('#submitBtn').firstChild.textContent = up ? '登録する ' : 'ログイン ';
      $('#modeBtn').textContent = up ? 'アカウントをお持ちの方はログイン' : 'はじめての方は新規登録';
      $('#password').autocomplete = up ? 'new-password' : 'current-password';
      say('', '');
    }
    $('#modeBtn').addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));

    const controls = () => document.querySelectorAll('#loginForm input, #loginForm button');
    if (!cloud.supabase) {
      // Supabase の設定が無いときは、ログインせずに使ってもらう
      say('いまはログインを使えません。「ゲストとして使ってみる」からノートを開けます（この端末の中だけに保存されます）。', 'error');
      controls().forEach((el) => { el.disabled = true; });
    } else if (await cloud.currentUser()) {
      location.replace(NEXT); // すでにログイン中 (確認メールや Google から戻ってきたときも含む)
    }

    $('#googleBtn').addEventListener('click', async () => {
      const { error } = await cloud.supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: new URL(NEXT, location.href).href },
      });
      if (error) say(message(error), 'error');
    });

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#email').value.trim();
      const password = $('#password').value;
      if (!email || !$('#email').checkValidity()) { say('メールアドレスを正しく入力してください。', 'error'); $('#email').focus(); return; }
      if (!password) { say('パスワードを入力してください。', 'error'); $('#password').focus(); return; }
      if (mode === 'signup' && password.length < 8) { say('パスワードは8文字以上にしてください。', 'error'); $('#password').focus(); return; }

      controls().forEach((b) => { b.disabled = true; });
      say('', '');
      try {
        if (mode === 'signin') {
          const { error } = await cloud.supabase.auth.signInWithPassword({ email, password });
          if (error) { say(message(error), 'error'); return; }
          location.replace(NEXT);
        } else {
          const { data, error } = await cloud.supabase.auth.signUp({
            email, password,
            options: { emailRedirectTo: new URL('login.html', location.href).href },
          });
          if (error) { say(message(error), 'error'); return; }
          if (data.session) location.replace(NEXT);
          else say('確認メールを送りました。メールのリンクを開くとログインできます。', 'ok');
        }
      } finally {
        controls().forEach((b) => { b.disabled = false; });
      }
    });
  </script>
</body>
</html>
